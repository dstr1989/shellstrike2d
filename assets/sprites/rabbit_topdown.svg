<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Shellstrike2D - Rabbit unit, top-down gameplay sprite, facing +X (right) -->
  <g stroke="#1B1B1F" stroke-width="4" stroke-linejoin="round">
    <!-- ears (seen from above, swept back) -->
    <path d="M58 30 C 40 6, 26 4, 20 14 C 30 22, 40 30, 50 40 Z" fill="#F2C9A0"/>
    <path d="M58 98 C 40 122, 26 124, 20 114 C 30 106, 40 98, 50 88 Z" fill="#F2C9A0"/>
    <path d="M52 26 C 40 10, 30 9, 25 16 C 33 22, 42 28, 49 36 Z" fill="#F08FA2" opacity="0.7"/>
    <path d="M52 102 C 40 118, 30 119, 25 112 C 33 106, 42 100, 49 92 Z" fill="#F08FA2" opacity="0.7"/>
    <!-- back feet -->
    <ellipse cx="26" cy="48" rx="11" ry="8" fill="#F2C9A0"/>
    <ellipse cx="26" cy="80" rx="11" ry="8" fill="#F2C9A0"/>
    <!-- body -->
    <ellipse cx="58" cy="64" rx="34" ry="26" fill="#F2C9A0"/>
    <!-- head -->
    <circle cx="98" cy="64" r="17" fill="#F2C9A0"/>
  </g>
  <ellipse cx="48" cy="56" rx="12" ry="7" fill="#FFE6BF" opacity="0.6"/>
  <!-- tactical bandana -->
  <path d="M84 50 Q98 44 112 52 L110 62 Q98 56 86 60 Z" fill="#C1502E" stroke="#1B1B1F" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="102" cy="58" r="6" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="2.5"/>
  <circle cx="102" cy="70" r="6" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="2.5"/>
  <circle cx="104" cy="58" r="2.6" fill="#1B1B1F"/>
  <circle cx="104" cy="70" r="2.6" fill="#1B1B1F"/>
  <!-- nose -->
  <circle cx="115" cy="64" r="2.6" fill="#1B1B1F"/>
  <!-- blaster -->
  <rect x="114" y="58" width="18" height="11" rx="3" fill="#5B5F66" stroke="#1B1B1F" stroke-width="3"/>
  <rect x="108" y="60" width="9" height="7" fill="#8A8F99" stroke="#1B1B1F" stroke-width="2.5"/>
</svg>
