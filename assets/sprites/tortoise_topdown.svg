<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Shellstrike2D - Tortoise unit, top-down gameplay sprite, facing +X (right) -->
  <g stroke="#1B1B1F" stroke-width="4" stroke-linejoin="round">
    <!-- back legs -->
    <ellipse cx="30" cy="40" rx="10" ry="8" fill="#F4E9C9"/>
    <ellipse cx="30" cy="88" rx="10" ry="8" fill="#F4E9C9"/>
    <!-- shell -->
    <ellipse cx="56" cy="64" rx="42" ry="36" fill="#2E9E6B"/>
    <!-- head -->
    <circle cx="100" cy="64" r="18" fill="#F4E9C9"/>
    <!-- front legs -->
    <ellipse cx="70" cy="32" rx="9" ry="7" fill="#F4E9C9"/>
    <ellipse cx="70" cy="96" rx="9" ry="7" fill="#F4E9C9"/>
  </g>
  <!-- shell plate seams (no outline, just shading lines) -->
  <g stroke="#1F7A52" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30 64 L82 64"/>
    <path d="M40 38 L66 50"/>
    <path d="M40 90 L66 78"/>
    <path d="M56 30 L56 98"/>
  </g>
  <ellipse cx="44" cy="50" rx="14" ry="9" fill="#5FD79A" opacity="0.55"/>
  <!-- bandana -->
  <path d="M86 50 Q100 44 114 52 L112 62 Q100 56 88 60 Z" fill="#274C77" stroke="#1B1B1F" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="104" cy="58" r="6" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="2.5"/>
  <circle cx="104" cy="70" r="6" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="2.5"/>
  <circle cx="106" cy="58" r="2.6" fill="#1B1B1F"/>
  <circle cx="106" cy="70" r="2.6" fill="#1B1B1F"/>
  <!-- blaster -->
  <rect x="118" y="58" width="20" height="12" rx="3" fill="#5B5F66" stroke="#1B1B1F" stroke-width="3"/>
  <rect x="112" y="60" width="10" height="8" fill="#8A8F99" stroke="#1B1B1F" stroke-width="2.5"/>
</svg>
