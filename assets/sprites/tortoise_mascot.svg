  <circle cx="230" cy="160" r="9" fill="#1B1B1F"/>
  <circle cx="294" cy="160" r="9" fill="#1B1B1F"/>
  <path d="M236 196 Q256 210 276 196" fill="none" stroke="#1B1B1F" stroke-width="7" stroke-linecap="round"/>
  <!-- blaster prop -->
